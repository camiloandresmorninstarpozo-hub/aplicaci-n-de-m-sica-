name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/jk/music
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "JKMUSICK"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.jk.music"
            compileSdk = 34
            defaultConfig { applicationId = "com.jk.music"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
            signingConfigs { create("fixed") { storeFile = file("fixed.p12"); storeType = "pkcs12"; storePassword = "jkmusick"; keyAlias = "jk"; keyPassword = "jkmusick" } }
            buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("fixed") } }
          }
          dependencies {
            implementation("androidx.media3:media3-exoplayer:1.3.1")
            implementation("androidx.media3:media3-session:1.3.1")
            implementation("androidx.documentfile:documentfile:1.0.1")
            implementation("androidx.activity:activity-ktx:1.9.0")
            implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:label="JKMUSICK" android:icon="@drawable/ic_launcher" android:allowBackup="true" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".PlayService" android:exported="true" android:foregroundServiceType="mediaPlayback">
                <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
              </service>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/jk/music/PlayService.kt <<'EOF'
          package com.jk.music

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlayService : MediaSessionService() {
            private var session: MediaSession? = null
            override fun onCreate() {
              super.onCreate()
              val attrs = AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).build()
              val p = ExoPlayer.Builder(this).setAudioAttributes(attrs, true).setHandleAudioBecomingNoisy(true).setWakeMode(C.WAKE_MODE_LOCAL).build()
              session = MediaSession.Builder(this, p).build()
            }
            override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session
            override fun onDestroy() {
              session?.let { it.player.release(); it.release() }
              session = null
              super.onDestroy()
            }
          }
          EOF
          cp MainActivity.kt app/src/main/java/com/jk/music/MainActivity.kt
      - name: Icono
        run: |
          python3 - <<'PY'
          import os
          pal={'o':'#1E0F40','p':'#6E49B8','l':'#9F7BEA','w':'#FFFFFF'}
          L=[1]*10+[2,3,4,5,6,7]; R=[14]*10+[13,12,11,10,9,8]
          def ins(x,y): return 0<=y<16 and L[y]<=x<=R[y]
          g=[['.']*16 for _ in range(16)]
          for y in range(16):
            for x in range(16):
              if ins(x,y):
                e=not(ins(x-1,y) and ins(x+1,y) and ins(x,y-1) and ins(x,y+1))
                g[y][x]='o' if e else ('l' if y<=3 else 'p')
          for x,h in [(3,2),(5,3),(7,5),(8,5),(10,3),(12,2)]:
            for y in range(8-h,8+h):
              if g[y][x] in 'pl': g[y][x]='w'
          runs=[]
          for y in range(16):
            x=0
            while x<16:
              c=g[y][x]
              if c=='.':
                x+=1; continue
              n=1
              while x+n<16 and g[y][x+n]==c: n+=1
              runs.append('<path android:fillColor="%s" android:pathData="M%d,%dh%dv1h-%dz"/>'%(pal[c],x,y,n,n))
              x+=n
          H='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="%d" android:viewportHeight="%d">'
          BG='<path android:fillColor="#17141F" android:pathData="M0,0h%dv%dh-%dz"/>'
          d='app/src/main/res/'
          os.makedirs(d+'drawable',exist_ok=True); os.makedirs(d+'drawable-anydpi-v26',exist_ok=True)
          open(d+'drawable/ic_launcher.xml','w').write('\n'.join([H%(16,16),BG%(16,16,16)]+runs+['</vector>']))
          open(d+'drawable/ic_fg.xml','w').write('\n'.join([H%(28,28),'<group android:translateX="6" android:translateY="6">']+runs+['</group>','</vector>']))
          open(d+'drawable/ic_bg.xml','w').write('\n'.join([H%(28,28),BG%(28,28,28),'</vector>']))
          open(d+'drawable-anydpi-v26/ic_launcher.xml','w').write('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/></adaptive-icon>')
          try:
            from PIL import Image
            im=Image.new('RGB',(16,16),(23,20,31))
            for y in range(16):
              for x in range(16):
                if g[y][x]!='.': im.putpixel((x,y),tuple(int(pal[g[y][x]][i:i+2],16) for i in (1,3,5)))
            im.resize((256,256),Image.NEAREST).save('/mnt/user-data/outputs/icono-app.png')
          except Exception as e: print('sin preview',e)
          PY
      - name: Firma fija
        run: base64 -d ks.b64 > app/fixed.p12
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JKMUSICK-apk
          path: app/build/outputs/apk/debug/app-debug.apk
