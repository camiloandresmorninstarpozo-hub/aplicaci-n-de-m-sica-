name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Crear proyecto
        run: |
          mkdir -p app/src/main/java/com/jk/music
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "JKMUSICK"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
            id("com.android.application") version "8.5.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.jk.music"
            compileSdk = 34
            defaultConfig { applicationId = "com.jk.music"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation("androidx.media3:media3-exoplayer:1.3.1")
            implementation("androidx.media3:media3-session:1.3.1")
            implementation("androidx.documentfile:documentfile:1.0.1")
            implementation("androidx.activity:activity-ktx:1.9.0")
            implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.WAKE_LOCK"/>
            <application android:label="JKMUSICK" android:allowBackup="true" android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".PlayService" android:exported="true" android:foregroundServiceType="mediaPlayback">
                <intent-filter><action android:name="androidx.media3.session.MediaSessionService"/></intent-filter>
              </service>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/jk/music/PlayService.kt <<'EOF'
          package com.jk.music

          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.session.MediaSession
          import androidx.media3.session.MediaSessionService

          class PlayService : MediaSessionService() {
            private var session: MediaSession? = null
            override fun onCreate() {
              super.onCreate()
              val attrs = AudioAttributes.Builder().setUsage(C.USAGE_MEDIA).setContentType(C.AUDIO_CONTENT_TYPE_MUSIC).build()
              val p = ExoPlayer.Builder(this).setAudioAttributes(attrs, true).setHandleAudioBecomingNoisy(true).setWakeMode(C.WAKE_MODE_LOCAL).build()
              session = MediaSession.Builder(this, p).build()
            }
            override fun onGetSession(controllerInfo: MediaSession.ControllerInfo): MediaSession? = session
            override fun onDestroy() {
              session?.let { it.player.release(); it.release() }
              session = null
              super.onDestroy()
            }
          }
          EOF
          cp MainActivity.kt app/src/main/java/com/jk/music/MainActivity.kt
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: JKMUSICK-apk
          path: app/build/outputs/apk/debug/app-debug.apk
